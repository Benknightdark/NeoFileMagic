name: Test and Auto PR

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Create Pull Request to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_exists=$(gh pr list --base master --head develop --state open --json number -q '.[].number')
          if [ -z "$pr_exists" ]; then
            echo "建立從 develop 到 master 的 Pull Request..."
            gh pr create \
              --base master \
              --head develop \
              --title "Auto PR: develop ➜ master" \
              --body "自動化測試已在 develop 分支通過。此 PR 由 GitHub Actions 自動建立。"
          else
            echo "已存在開啟中的 PR (#$pr_exists)，跳過建立步驟。"
          fi
