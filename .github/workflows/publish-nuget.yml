name: Publish to NuGet

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: write

jobs:
  pack-and-publish:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Update Version in csproj
        id: bump_version
        run: |
          current_version=$(grep -oPm1 '(?<=<Version>)[^<]+' NeoFileMagic/NeoFileMagic.csproj)
          echo "Current version: $current_version"
          
          if [[ $current_version =~ ^([0-9]+\.[0-9]+\.[0-9]+\.)([0-9]+)$ ]]; then
            prefix="${BASH_REMATCH[1]}"
            revision="${BASH_REMATCH[2]}"
            new_revision=$((revision + 1))
            new_version="${prefix}${new_revision}"
          else
            new_version="${current_version}.1"
          fi
          echo "New version: $new_version"
          
          sed -i "s|<Version>$current_version</Version>|<Version>$new_version</Version>|g" NeoFileMagic/NeoFileMagic.csproj
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add NeoFileMagic/NeoFileMagic.csproj
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.version }} [skip ci]"
          git push origin master

      - name: Build (Release)
        run: dotnet build NeoFileMagic -c Release -p:Version=${{ steps.bump_version.outputs.version }} --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          dotnet pack NeoFileMagic \
            -c Release \
            -p:PackageVersion=${{ steps.bump_version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg \
            --no-build \
            -o ./artifacts

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret 未設定" >&2
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_version="${{ steps.bump_version.outputs.version }}"
          echo "正在為 v${new_version} 建立 GitHub Release..."
          gh release create "v${new_version}" artifacts/* \
            --target master \
            --title "Release v${new_version}" \
            --notes "自動化發佈：由 PR 合併至 master 後自動產生的版本與套件。"

